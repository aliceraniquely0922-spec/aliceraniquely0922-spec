<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página Pessoal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #9f02fa;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
             background: #9f02fa;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #9f02fa;
            margin: 5px 0;
            padding: 8px;
            border-radius: 4px;
            display: inline-block;
            margin-right: 5px;
        }
        .links a {
            display: inline-block;
            margin: 10px;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto de Perfil -->
        <img src="https://placeholder.com" alt="Minha foto de perfil">
        
        <!-- Nome e Profissão -->
        <h2> Alice Raniquely lima da silva</h2>
        <p>Estudante de tecnologia.</p>
        
        <!-- Sobre mim -->
        <h2>Sobre Mim</h2>
        <p>Gosto de aprender coisas novas e encarar desafios.</p>
        
        <!-- Habilidades -->
        <h2>habilidades</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
        
        <!-- Redes Sociais -->
        <h2>Contato</h2>
        <div class="links">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a>
        </div>
    </div>

</body>
</html>
